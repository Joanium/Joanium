name: ✅ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + architecture rules)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Copy-paste detection
        run: npm run cpd

      - name: Markdown lint
        run: npm run lint:md

      - name: Architecture check
        run: npm run check:arch
